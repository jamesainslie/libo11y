# Calls the same Makefile targets as `make ci`, split into parallel jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are canceled; pushes to main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [go, go/o11ygin, go/o11yconnect, go/o11ysql]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # match `golangci-lint version` used locally
          working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The go directive is 1.26.0 (golang.org/x/net requires it), so
        # older toolchains cannot build the modules.
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go/go.sum
            go/o11ygin/go.sum
            go/o11yconnect/go.sum
            go/o11ysql/go.sum
      - run: make vet test tidy-check GO_TEST_P=4

  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go/go.sum
      - run: make spec-check spec-drift schema-published-test release-notes-test release-tag-test

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      # Bun's global install cache, keyed on the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Every suite runs under Bun and under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: make ts-check ts-browser-bundle-test

  # The browser packages' suites under Playwright and headless Chromium.
  ts-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      # Bun's global install cache, keyed on the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      # Playwright's browser builds, keyed on the lockfile that pins
      # Playwright. No restore-keys: another Playwright version's browsers
      # would only take up space.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
      - run: make ts-install
      # --no-install runs the Playwright that ts/bun.lock pins and fails if
      # it is missing. --with-deps installs Chromium's system libraries,
      # which the cache does not hold. A cached Chromium is not downloaded
      # again.
      - name: Install Playwright's Chromium
        working-directory: ts
        run: bun x --no-install playwright install --with-deps chromium
      - run: make ts-browser-test

  # The Rust workspace: fmt, clippy, tests and docs on the pinned toolchain.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to a master commit; the toolchain input picks the release.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      # Cargo's registry and the workspace's target directory, keyed on
      # rust/Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: make rust-check

  # The workspace must build on its minimum supported Rust version
  # (rust-version in rust/Cargo.toml).
  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv
      - run: make rust-msrv RUST_MSRV=1.88

  # The Zig package on Linux and macOS. The process metrics a later step
  # adds read different system interfaces on each.
  zig:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Also caches the global Zig cache, which holds the fetched packages.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"
      - run: make zig-check ZIG_BUILD_J=4

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            go/go.sum
            go/o11ygin/go.sum
            go/o11yconnect/go.sum
            go/o11ysql/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make vuln

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            go/go.sum
            go/o11ygin/go.sum
            go/o11yconnect/go.sum
            go/o11ysql/go.sum
      # The TypeScript half packs the packages and imports them under Bun and Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      # Bun's global install cache, keyed on the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: make release-check
