# Publishes a Go module release when its tag is pushed: go/vX.Y.Z for
# github.com/jamesainslie/libo11y/go, and go/<sub>/vX.Y.Z for each
# submodule (o11ygin, o11yconnect, o11ysql). Push the go/ tag first; every
# tag of one release goes on the same commit. Rerunning a release is safe:
# an existing GitHub Release has its notes replaced.
#
# A go/o11yrum/vX.Y.Z tag releases the o11yrum RUM gateway module, which
# versions on its own line. It goes on any commit, and its go.mod may
# require any released parent version, so verify checks that the required
# go/ tag exists instead of requiring it on the same commit. The release
# notes come from go/o11yrum/CHANGELOG.md, the GitHub Release is never
# marked Latest, and the image job builds ghcr.io/jamesainslie/o11yrum-gateway
# for linux/amd64 and linux/arm64, pushes it tagged X.Y.Z (and X.Y and
# latest for a non-prerelease), and attests its build provenance, so
# `gh attestation verify oci://ghcr.io/jamesainslie/o11yrum-gateway:X.Y.Z
# --repo jamesainslie/libo11y` checks it.
#
# A ts/vX.Y.Z tag publishes every @libo11y/* package to npm at X.Y.Z with
# provenance. It authenticates through npm trusted publishing: each package
# trusts this workflow file in this repository, and no npm token is stored.
# Trusted publishing cannot create a package, so scripts/ts-npm-plan.sh
# leaves a package new to npm out of npm with a warning. It fails the
# release before anything publishes if a package on npm depends on one
# that is not. The smoke job waits for the registry to serve the new versions of
# the published packages, installs a package not on npm yet from its
# tarball, installs the server packages under Node and Bun, bundles the
# browser packages for the browser, and only then is the GitHub Release
# created, with every packed tarball attached.
# Rerunning is safe for packages already on the registry, which are
# skipped.
#
# A zig/vX.Y.Z tag validates both Zig manifests, zig/CHANGELOG.md, the Zig
# test suite, and a throwaway consumer tarball build, publishes the GitHub
# Release titled `libo11y-zig vX.Y.Z` (never marked Latest), and runs a live
# consumer smoke test fetching `git+https://github.com/<repo>#zig/vX.Y.Z`.
#
# A python/vX.Y.Z tag validates python/pyproject.toml, python/CHANGELOG.md,
# the Python test suite, and a throwaway wheel/sdist consumer check, builds
# and publishes `libo11y` to PyPI through OIDC trusted publishing with
# attestations, runs a live PyPI consumer smoke test, and then publishes the
# GitHub Release titled `libo11y-python vX.Y.Z` (never marked Latest).
#
# A rust/vX.Y.Z tag validates lockstep workspace versions, rust/CHANGELOG.md,
# `make rust-check`, and `make rust-msrv`, publishes all eleven crates to
# crates.io in dependency order through crates.io trusted publishing
# (skipping any crate version already on crates.io), runs a live consumer
# smoke test against crates.io, and publishes the GitHub Release titled
# `libo11y Rust vX.Y.Z` (never marked Latest).
#
# A c/vX.Y.Z tag validates c/build.zig.zon, c/CHANGELOG.md, `make c-check`,
# and `scripts/c-release-check.sh`, builds a ReleaseSafe install archive with
# SHA256SUMS, and publishes the GitHub Release titled `libo11y-c vX.Y.Z`
# (never marked Latest).
#
# An ops/vX.Y.Z tag validates the ops pack (generator drift, the gateway name
# catalog, query lint, promtool checks and unit tests, kustomize), runs
# scripts/ops-release-check.sh, and publishes the GitHub Release titled
# `libo11y-ops vX.Y.Z` (never marked Latest) with libo11y-ops-vX.Y.Z.tar.gz
# and SHA256SUMS attached. The archive is built by the same script, so it
# matches what the check validated.
#
# scripts/release-tag.sh routes the tag. The verify job's kind output (go,
# ts, zig, python, rust, c or ops) selects the jobs and steps that run.
name: release

on:
  push:
    tags:
      - "go/v*"
      - "go/o11ygin/v*"
      - "go/o11yconnect/v*"
      - "go/o11ysql/v*"
      - "go/o11yrum/v*"
      - "ts/v*"
      - "zig/v*"
      - "python/v*"
      - "rust/v*"
      - "c/v*"
      - "ops/v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      dir: ${{ steps.tag.outputs.dir }}
      module: ${{ steps.tag.outputs.module }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      lockstep: ${{ steps.tag.outputs.lockstep }}
      changelog: ${{ steps.tag.outputs.changelog }}
      # The rust branch only: every publishable crate in topological order, space separated.
      rust_crates: ${{ steps.rust_crates.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the module and version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The script explains a refused tag on stderr.
          if ! scripts/release-tag.sh "$TAG" >"$RUNNER_TEMP/release-tag.out"; then
            echo "::error::$TAG is not a release tag with a semantic version (go/vX.Y.Z, go/<submodule>/vX.Y.Z, go/o11yrum/vX.Y.Z, ts/vX.Y.Z, zig/vX.Y.Z, python/vX.Y.Z, rust/vX.Y.Z, c/vX.Y.Z or ops/vX.Y.Z)"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-tag.out" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.tag.outputs.kind == 'go'
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            go/go.sum
            go/o11ygin/go.sum
            go/o11yconnect/go.sum
            go/o11ysql/go.sum
            go/o11yrum/go.sum
      - name: Require the parent tag on the same commit
        if: steps.tag.outputs.kind == 'go' && steps.tag.outputs.dir != 'go' && steps.tag.outputs.lockstep == 'true'
        env:
          TAG: ${{ github.ref_name }}
          DIR: ${{ steps.tag.outputs.dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          parent="go/v$VERSION"
          git fetch --force --tags origin
          if ! parent_commit="$(git rev-parse --verify --quiet "refs/tags/$parent^{commit}")"; then
            echo "::error::$parent does not exist; push it before $TAG"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if [[ "$parent_commit" != "$tag_commit" ]]; then
            echo "::error::$TAG is on $tag_commit but $parent is on $parent_commit; tag one commit"
            exit 1
          fi
          required="$(cd "$DIR" && go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/jamesainslie/libo11y/go") | .Version')"
          if [[ "$required" != "v$VERSION" ]]; then
            echo "::error::$DIR/go.mod requires the parent at ${required:-nothing}, not v$VERSION"
            exit 1
          fi
      # o11yrum versions on its own line: its tag goes on any commit, and
      # the parent version its go.mod requires must be a released go/ tag.
      - name: Require the parent release o11yrum depends on
        if: steps.tag.outputs.kind == 'go' && steps.tag.outputs.lockstep == 'false'
        env:
          DIR: ${{ steps.tag.outputs.dir }}
        run: |
          required="$(cd "$DIR" && go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/jamesainslie/libo11y/go") | .Version')"
          git fetch --force --tags origin
          if [[ -z "$required" ]] || ! git rev-parse --verify --quiet "refs/tags/go/$required^{commit}" >/dev/null; then
            echo "::error::$DIR/go.mod requires the parent at ${required:-nothing}, which has no go/ release tag"
            exit 1
          fi
          echo "$DIR requires github.com/jamesainslie/libo11y/go $required, released as go/$required"
      - name: Require O11YRUM_RELEASE_VERSION at the tag's version
        if: steps.tag.outputs.dir == 'go/o11yrum'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          got="$(make -s --no-print-directory print-o11yrum-release-version)"
          if [[ "$got" != "v$VERSION" ]]; then
            echo "::error::the Makefile's O11YRUM_RELEASE_VERSION is $got, not v$VERSION; the release commit moves it"
            exit 1
          fi
      - name: Check the changelog has release notes
        if: steps.tag.outputs.kind == 'go'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: scripts/release-notes.sh "$VERSION" "$CHANGELOG"
      - if: steps.tag.outputs.kind == 'go'
        run: make vet test spec-check spec-drift GO_TEST_P=4
      # Builds, vets and tests o11yrum without its replace directive against
      # the parent it requires, installs the command and builds an external
      # consumer, all against a throwaway local remote.
      - name: Validate the o11yrum release as an external consumer
        if: steps.tag.outputs.dir == 'go/o11yrum'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/o11yrum-release-check.sh "v$VERSION"

      # The TypeScript branch. The release commit moved every package to the
      # tag's version (bun scripts/release.ts version X.Y.Z).
      - name: Require every package at the tag's version
        if: steps.tag.outputs.kind == 'ts'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          for manifest in ts/packages/*/package.json; do
            got="$(jq -r .version "$manifest")"
            if [[ "$got" != "$VERSION" ]]; then
              echo "::error::$manifest is at version $got, not $VERSION; the release commit runs bun scripts/release.ts version $VERSION"
              exit 1
            fi
          done
      - name: Check the TypeScript changelog has release notes
        if: steps.tag.outputs.kind == 'ts'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" ts/CHANGELOG.md
      - uses: oven-sh/setup-bun@v2
        if: steps.tag.outputs.kind == 'ts'
        with:
          bun-version: "1.3.13"
      # Bun's global install cache, keyed on the lockfile.
      - uses: actions/cache@v6
        if: steps.tag.outputs.kind == 'ts'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ts/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Every suite runs under Bun and under Node.
      - uses: actions/setup-node@v7
        if: steps.tag.outputs.kind == 'ts'
        with:
          node-version: "24.x"
      - if: steps.tag.outputs.kind == 'ts'
        run: make ts-check
      # Pack the tag's version and install the tarballs into a consumer under
      # Node and Bun before anything reaches the registry.
      - name: Pack and install the packages at the tag's version
        if: steps.tag.outputs.kind == 'ts'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/ts-release-check.sh "v$VERSION"

      # The Zig branch. Both manifests (root shim and zig/) must carry the
      # tag's version and zig/CHANGELOG.md must hold its release notes.
      - name: Require both Zig manifests at the tag's version
        if: steps.tag.outputs.kind == 'zig'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          for manifest in build.zig.zon zig/build.zig.zon; do
            got="$(sed -nE 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$manifest" | head -n 1)"
            if [[ "$got" != "$VERSION" ]]; then
              echo "::error::$manifest is at version ${got:-unset}, not $VERSION"
              exit 1
            fi
          done
      - name: Check the Zig changelog has release notes
        if: steps.tag.outputs.kind == 'zig'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" zig/CHANGELOG.md
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.tag.outputs.kind == 'zig'
        with:
          version: "0.17.1"
      - if: steps.tag.outputs.kind == 'zig'
        run: make zig-check ZIG_BUILD_J=4
      - name: Validate the Zig package as an external consumer
        if: steps.tag.outputs.kind == 'zig'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          ZIG_BUILD_J: "4"
        run: scripts/zig-release-check.sh "v$VERSION"

      # The Python branch. python/pyproject.toml must carry the tag's version
      # and python/CHANGELOG.md must hold its release notes.
      - name: Require python/pyproject.toml at the tag's version
        if: steps.tag.outputs.kind == 'python'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          got="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' python/pyproject.toml | head -n 1)"
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error::python/pyproject.toml is at version ${got:-unset}, not $VERSION"
            exit 1
          fi
      - name: Check the Python changelog has release notes
        if: steps.tag.outputs.kind == 'python'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" python/CHANGELOG.md
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.tag.outputs.kind == 'python'
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.13"
      - if: steps.tag.outputs.kind == 'python'
        run: make python-check PYTHON_WORKERS=2
      - name: Build and validate the Python wheel and sdist as an external consumer
        if: steps.tag.outputs.kind == 'python'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/python-release-check.sh "v$VERSION"

      # The Rust branch. Every publishable crate in rust/ must carry the tag's
      # version, rust/CHANGELOG.md must hold its release notes, and both the
      # MSRV toolchain and the pinned toolchain must pass.
      # Install 1.88 first and 1.95.0 second so 1.95.0 is the active default
      # toolchain when `make rust-check` runs.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        if: steps.tag.outputs.kind == 'rust'
        with:
          toolchain: "1.88"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        if: steps.tag.outputs.kind == 'rust'
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.tag.outputs.kind == 'rust'
        with:
          workspaces: rust
      - name: Check the Rust changelog has release notes
        if: steps.tag.outputs.kind == 'rust'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" rust/CHANGELOG.md
      - name: Validate Rust lockstep versions, changelog, and package hygiene
        id: rust_crates
        if: steps.tag.outputs.kind == 'rust'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          scripts/rust-release-check.sh "v$VERSION" --write-order "$RUNNER_TEMP/rust-crates.txt"
          echo "crates=$(cat "$RUNNER_TEMP/rust-crates.txt")" >>"$GITHUB_OUTPUT"
      - name: Run Rust workspace checks and MSRV verification
        if: steps.tag.outputs.kind == 'rust'
        run: |
          make rust-check RUST_JOBS=4
          make rust-msrv RUST_MSRV=1.88 RUST_JOBS=4

      # The C branch. c/build.zig.zon must carry the tag's version and
      # c/CHANGELOG.md must hold its release notes.
      - name: Require c/build.zig.zon at the tag's version
        if: steps.tag.outputs.kind == 'c'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          got="$(sed -nE 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' c/build.zig.zon | head -n 1)"
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error::c/build.zig.zon is at version ${got:-unset}, not $VERSION"
            exit 1
          fi
      - name: Check the C changelog has release notes
        if: steps.tag.outputs.kind == 'c'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" c/CHANGELOG.md
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.tag.outputs.kind == 'c'
        with:
          version: "0.17.1"
      - if: steps.tag.outputs.kind == 'c'
        run: make c-check ZIG_BUILD_J=4
      - name: Validate the C install prefix and external C11 consumer
        if: steps.tag.outputs.kind == 'c'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          ZIG_BUILD_J: "4"
        run: scripts/c-release-check.sh "v$VERSION"

      # The ops branch: the pack's own checks, then the release check, which
      # requires version.go, a dated ops/CHANGELOG.md section, generated
      # artifacts and runbook links at the tag's version.
      - uses: actions/setup-go@v7
        if: steps.tag.outputs.kind == 'ops'
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            ops/go.sum
            go/go.sum
            go/o11yrum/go.sum
      - if: steps.tag.outputs.kind == 'ops'
        run: make ops-check GO_TEST_P=4
      - name: Validate the ops pack and its release archive
        if: steps.tag.outputs.kind == 'ops'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/ops-release-check.sh "v$VERSION"

  release:
    needs: verify
    if: needs.verify.outputs.kind == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ needs.verify.outputs.dir }}
          MODULE: ${{ needs.verify.outputs.module }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          CHANGELOG: ${{ needs.verify.outputs.changelog }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$VERSION" "$CHANGELOG" >"$notes"
          title="$MODULE v$VERSION"
          # The main module's release is the repository's Latest release; the
          # submodules' releases, and o11yrum's, never take it.
          latest=false
          if [[ "$DIR" == "go" && "$PRERELEASE" == "false" ]]; then
            latest=true
          fi
          if gh release view "$TAG" >/dev/null; then
            echo "$TAG already has a release; replacing its title and notes"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest="$latest"
          else
            gh release create "$TAG" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest="$latest"
          fi

  proxy:
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODULE: ${{ needs.verify.outputs.module }}
      VERSION: ${{ needs.verify.outputs.version }}
      # Resolve like an external consumer: the public proxy and checksum
      # database, no workspace, nothing private.
      GOPROXY: https://proxy.golang.org
      GOFLAGS: -mod=mod
      GOWORK: "off"
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: ""
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          # No checkout and no cache: every module comes from the proxy.
          cache: false
      - name: Request the version from proxy.golang.org
        working-directory: ${{ runner.temp }}
        run: |
          for attempt in 1 2 3 4 5; do
            if go list -m "$MODULE@v$VERSION"; then
              exit 0
            fi
            echo "attempt $attempt: $MODULE@v$VERSION is not on the proxy yet" >&2
            sleep $((attempt * 20))
          done
          echo "::error::proxy.golang.org did not serve $MODULE@v$VERSION"
          exit 1
      - name: Build a consumer against the published version
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          go mod init example.com/consumer
          printf 'package main\n\nimport _ "%s"\n\nfunc main() {}\n' "$MODULE" >main.go
          go get "$MODULE@v$VERSION"
          go build ./...

  # Publishes ghcr.io/jamesainslie/o11yrum-gateway for a go/o11yrum tag,
  # for linux/amd64 and linux/arm64, with build provenance attested to
  # GitHub and pushed to the registry. Operators mirror it to their own
  # registry and pin it by the digest the job summary prints.
  image:
    needs: [verify, release]
    if: needs.verify.outputs.dir == 'go/o11yrum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/jamesainslie/o11yrum-gateway
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute the tags
        id: tags
        run: |
          tags="$IMAGE:$VERSION"
          if [[ "$PRERELEASE" == "false" ]]; then
            tags+=",$IMAGE:${VERSION%.*},$IMAGE:latest"
          fi
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: go/o11yrum
          file: go/o11yrum/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=v${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=o11yrum-gateway
            org.opencontainers.image.description=The libo11y RUM gateway
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          got="$(docker run --rm "$IMAGE@$DIGEST" -version)"
          if [[ "$got" != "v$VERSION" ]]; then
            echo "::error::$IMAGE@$DIGEST prints version $got, not v$VERSION"
            exit 1
          fi
      - name: Write the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## o11yrum-gateway v$VERSION"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            echo
            IFS=',' read -ra tags <<<"$TAGS"
            for t in "${tags[@]}"; do
              echo "- \`$t\`"
            done
            echo
            echo "Pin it by digest and verify its provenance:"
            echo
            echo '```sh'
            echo "docker pull $IMAGE@$DIGEST"
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo $REPO"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  publish-npm:
    needs: verify
    if: needs.verify.outputs.kind == 'ts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The workflow's OIDC identity authenticates to npm through trusted
      # publishing and signs each package's provenance.
      id-token: write
    outputs:
      # Packages new to npm, space separated: they stay tarballs on the
      # GitHub Release until a maintainer publishes them by hand.
      unpublished: ${{ steps.plan.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      # No dependency cache: what publishes is built from the lockfile alone.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
      - name: Build the packages
        working-directory: ts
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Pack the packages
        working-directory: ts
        run: bun scripts/release.ts pack "$RUNNER_TEMP/packs" >"$RUNNER_TEMP/tarballs.txt"
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install a pinned npm
        run: npm install --global npm@11.21.2
      # npm trusted publishing cannot create a package, so a package new to
      # npm is left out of npm and ships as a tarball on the GitHub Release.
      # The plan fails, before anything publishes, when a package on npm
      # depends on one that is not.
      - name: Plan what publishes to npm
        id: plan
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          want="$(find ts/packages -mindepth 2 -maxdepth 2 -name package.json | wc -l)"
          got="$(wc -l <"$RUNNER_TEMP/tarballs.txt")"
          if [[ "$got" -ne "$want" ]]; then
            echo "::error::pack wrote $got tarballs for $want packages"
            exit 1
          fi
          plan="$RUNNER_TEMP/packs/plan.tsv"
          scripts/ts-npm-plan.sh plan "$VERSION" "$RUNNER_TEMP/tarballs.txt" >"$plan"
          unpublished="$(scripts/ts-npm-plan.sh names "$plan" tarball)"
          echo "unpublished=$unpublished" >>"$GITHUB_OUTPUT"
          {
            echo "### npm publish plan for $VERSION"
            echo
            echo "| Package | Action |"
            echo "| --- | --- |"
            while IFS=$'\t' read -r action pkg file; do
              case "$action" in
                publish) echo "| \`$pkg\` | publish to npm |" ;;
                present) echo "| \`$pkg\` | already on npm |" ;;
                new) echo "| \`$pkg\` | not on npm yet: \`$file\` on the GitHub Release only |" ;;
              esac
            done <"$plan"
          } >>"$GITHUB_STEP_SUMMARY"
          # PKG splits on spaces: npm package names have none.
          for pkg in $unpublished; do
            echo "::warning::$pkg is not on npm yet, so this release attaches its tarball to the GitHub Release and does not publish it. Publish its first version by hand and set up its trusted publisher (docs/CONVENTIONS.md)."
          done
      # The smoke job installs the tarballs that do not publish, and the
      # GitHub Release attaches every tarball.
      - uses: actions/upload-artifact@v7
        with:
          name: ts-packs
          path: |
            ${{ runner.temp }}/packs/*.tgz
            ${{ runner.temp }}/packs/plan.tsv
          if-no-files-found: error
          retention-days: 30
      # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for a
      # short-lived publish credential.
      - name: Publish the packages to npm with provenance
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # A prerelease must not move the latest dist-tag.
          dist_tag=latest
          if [[ "$PRERELEASE" == "true" ]]; then
            dist_tag=next
          fi
          # The plan lists the tarballs in dependency order, so each package
          # publishes after the @libo11y/* packages it depends on.
          while IFS=$'\t' read -r action pkg file; do
            case "$action" in
              publish) npm publish --provenance --access public --tag "$dist_tag" "$RUNNER_TEMP/packs/$file" </dev/null ;;
              present) echo "$pkg is already on the registry at this version; skipping it" ;;
              new) echo "$pkg is not on npm yet; skipping it" ;;
            esac
          done <"$RUNNER_TEMP/packs/plan.tsv"

  # The GitHub Release waits for the smoke job, so it only exists once the
  # published packages install from the registry. It attaches every packed
  # tarball, so a package not on npm yet installs from the release.
  release-ts:
    needs: [verify, npm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ts-packs
          path: ${{ runner.temp }}/packs
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          packs="$RUNNER_TEMP/packs"
          shopt -s nullglob
          tarballs=("$packs"/*.tgz)
          if ((${#tarballs[@]} == 0)); then
            echo "::error::the ts-packs artifact holds no tarballs"
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$VERSION" ts/CHANGELOG.md >"$notes"
          # A paragraph naming the packages not on npm yet, with the asset
          # URLs to install them from, or nothing.
          unpublished="$(scripts/ts-npm-plan.sh notes "$packs/plan.tsv" "$GH_REPO" "$TAG")"
          if [[ -n "$unpublished" ]]; then
            printf '\n%s\n' "$unpublished" >>"$notes"
          fi
          title="@libo11y v$VERSION"
          # The Go main module's release stays the repository's Latest release.
          if gh release view "$TAG" >/dev/null; then
            echo "$TAG already has a release; replacing its title, notes and tarballs"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest=false
            gh release upload "$TAG" "${tarballs[@]}" --clobber
          else
            gh release create "$TAG" "${tarballs[@]}" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest=false
          fi

  npm-smoke:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Resolve like an external consumer: the public registry, no workspace.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      # No cache, and only scripts/ checked out: every package comes from
      # the registry, or from its packed tarball when it is not on npm yet,
      # into consumers outside the checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      # The publish job's tarballs and plan.tsv, which says which packages
      # are on npm.
      - uses: actions/download-artifact@v8
        with:
          name: ts-packs
          path: ${{ runner.temp }}/packs
      - name: Wait for the published version on the registry
        run: |
          packages="$(scripts/ts-npm-plan.sh names "$RUNNER_TEMP/packs/plan.tsv" registry)"
          if [[ -z "$packages" ]]; then
            echo "no package is on npm; every one installs from its tarball"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          # 20 checks 30 seconds apart: time for the registry to serve the
          # new versions.
          for attempt in $(seq 1 20); do
            missing=""
            # packages splits on spaces: npm package names have none.
            for pkg in $packages; do
              if [[ "$(npm view "$pkg@$VERSION" version 2>/dev/null || true)" != "$VERSION" ]]; then
                missing="$missing $pkg"
              fi
            done
            if [[ -z "$missing" ]]; then
              exit 0
            fi
            echo "attempt $attempt: the registry does not serve$missing at $VERSION yet" >&2
            sleep 30
          done
          echo "::error::the registry did not serve$missing at $VERSION"
          exit 1
      # Each smoke installs pkg@VERSION from the registry, or the packed
      # tarball for a package not on npm yet (scripts/ts-npm-plan.sh specs).
      - name: Install and import the packages under Node
        run: |
          specs_out="$(scripts/ts-npm-plan.sh specs "$RUNNER_TEMP/packs/plan.tsv" "$VERSION" @libo11y/server @libo11y/test @libo11y/sourcemaps)"
          mapfile -t specs <<<"$specs_out"
          consumer="$(mktemp -d)"
          cd "$consumer"
          printf '{ "name": "libo11y-npm-smoke", "private": true, "type": "module" }\n' >package.json
          npm install --no-audit --no-fund --ignore-scripts "${specs[@]}"
          got="$(node --input-type=module -e '
          import { instrumentServe } from "@libo11y/server";
          import { createRecorder } from "@libo11y/test";
          const rec = await createRecorder({ serviceName: "npm-smoke" });
          const handler = instrumentServe(async () => new Response("ok"), { telemetry: rec.telemetry });
          await (await handler(new Request("http://smoke.test/"))).text();
          await rec.assertConforms();
          console.log(rec.spans().map((s) => s.name).join(","));
          await rec.shutdown();
          ')"
          if [[ "$got" != "GET" ]]; then
            echo "::error::node recorded the spans '$got', not one GET span"
            exit 1
          fi
          cat >registry.yaml <<'EOF'
          schema: libo11y.app-registry/v1
          namespace: smoke
          attributes:
            smoke.order.id: {type: string, sensitivity: internal, cardinality: unbounded}
          EOF
          npx --no-install libo11y registry check registry.yaml
          help="$(npx --no-install libo11y-sourcemaps --help)"
          grep -q '^usage: libo11y-sourcemaps upload' <<<"$help"
      - name: Install and import the packages under Bun
        run: |
          specs_out="$(scripts/ts-npm-plan.sh specs "$RUNNER_TEMP/packs/plan.tsv" "$VERSION" @libo11y/server @libo11y/test)"
          mapfile -t specs <<<"$specs_out"
          consumer="$(mktemp -d)"
          cd "$consumer"
          printf '{ "name": "libo11y-bun-smoke", "private": true, "type": "module" }\n' >package.json
          bun add "${specs[@]}"
          got="$(bun -e '
          import { instrumentServe } from "@libo11y/server";
          import { createRecorder } from "@libo11y/test";
          const rec = await createRecorder({ serviceName: "bun-smoke" });
          const handler = instrumentServe(async () => new Response("ok"), { telemetry: rec.telemetry });
          await (await handler(new Request("http://smoke.test/"))).text();
          await rec.assertConforms();
          console.log(rec.spans().map((s) => s.name).join(","));
          await rec.shutdown();
          ')"
          if [[ "$got" != "GET" ]]; then
            echo "::error::bun recorded the spans '$got', not one GET span"
            exit 1
          fi
      # The browser packages run in neither Node nor Bun. Bundle each entry
      # point for the browser and fail on any Node builtin, as
      # scripts/ts-release-check.sh does with the packed tarballs.
      - name: Install and bundle the browser packages
        run: |
          specs_out="$(scripts/ts-npm-plan.sh specs "$RUNNER_TEMP/packs/plan.tsv" "$VERSION" @libo11y/web @libo11y/webext @libo11y/rum @libo11y/rum-react @libo11y/rum-tanstack-router @libo11y/rum-connect @libo11y/rum-replay)"
          mapfile -t specs <<<"$specs_out"
          consumer="$(mktemp -d)"
          printf '{ "name": "libo11y-browser-smoke", "private": true, "type": "module" }\n' >"$consumer/package.json"
          (cd "$consumer" && npm install --no-audit --no-fund --ignore-scripts "${specs[@]}")
          scripts/ts-browser-bundle-check.sh "$consumer" @libo11y/web=setup @libo11y/webext @libo11y/rum=setupRum \
            @libo11y/rum-react=RumErrorBoundary @libo11y/rum-tanstack-router=instrumentTanStackRouter \
            @libo11y/rum-connect=connectRequestNaming @libo11y/rum-replay=replay,VERSION
      # A package not on npm yet installs from its tarball, with its other
      # dependencies from the registry, the way a consumer installs it from
      # the GitHub Release. The check fails on an incomplete dependency tree
      # or an entry point that does not resolve.
      - name: Install the packages not on npm yet from their tarballs
        run: |
          plan="$RUNNER_TEMP/packs/plan.tsv"
          unpublished="$(scripts/ts-npm-plan.sh names "$plan" tarball)"
          if [[ -z "$unpublished" ]]; then
            echo "every package is on npm"
            exit 0
          fi
          read -ra pkgs <<<"$unpublished"
          specs_out="$(scripts/ts-npm-plan.sh specs "$plan" "$VERSION" "${pkgs[@]}")"
          mapfile -t specs <<<"$specs_out"
          consumer="$(mktemp -d)"
          printf '{ "name": "libo11y-tarball-smoke", "private": true, "type": "module" }\n' >"$consumer/package.json"
          (cd "$consumer" && npm install --no-audit --no-fund --ignore-scripts "${specs[@]}")
          scripts/ts-npm-plan.sh check "$consumer" "${pkgs[@]}"

  zig-release:
    needs: verify
    if: needs.verify.outputs.kind == 'zig'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$VERSION" zig/CHANGELOG.md >"$notes"
          title="libo11y-zig v$VERSION"
          # The Go main module's release stays the repository's Latest release.
          if gh release view "$TAG" >/dev/null; then
            echo "$TAG already has a release; replacing its title and notes"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest=false
          else
            gh release create "$TAG" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest=false
          fi

  zig-smoke:
    needs: [verify, zig-release]
    if: needs.verify.outputs.kind == 'zig'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"
      - name: Fetch the pushed tag and run a consumer against an in-process OTLP receiver
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          ZIG_BUILD_J: "4"
        run: scripts/zig-release-check.sh "v$VERSION" --url "git+https://github.com/${GITHUB_REPOSITORY}#${TAG}"

  publish-pypi:
    needs: verify
    if: needs.verify.outputs.kind == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC identity authenticates to PyPI through trusted publishing and
      # signs PEP 740 digital attestations. No PyPI token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build --out-dir dist python
      - name: Publish to PyPI with trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true

  pypi-smoke:
    needs: [verify, publish-pypi]
    if: needs.verify.outputs.kind == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Wait for PyPI to serve libo11y at the released version
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/libo11y/${VERSION}/json" >/dev/null 2>&1; then
              exit 0
            fi
            echo "attempt $attempt: PyPI does not serve libo11y $VERSION yet" >&2
            sleep 30
          done
          echo "::error::PyPI did not serve libo11y $VERSION"
          exit 1
      - name: Install from PyPI into a fresh venv and run consumer smoke test
        run: scripts/python-release-check.sh "v$VERSION" --from-pypi

  release-python:
    needs: [verify, pypi-smoke]
    if: needs.verify.outputs.kind == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$VERSION" python/CHANGELOG.md >"$notes"
          title="libo11y-python v$VERSION"
          # The Go main module's release stays the repository's Latest release.
          if gh release view "$TAG" >/dev/null; then
            echo "$TAG already has a release; replacing its title and notes"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest=false
          else
            gh release create "$TAG" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest=false
          fi

  publish-rust:
    needs: verify
    if: needs.verify.outputs.kind == 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Exchanges the workflow's OIDC identity for a short-lived crates.io
      # publish token via trusted publishing (no long-lived token stored).
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Obtain crates.io trusted publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish Rust crates to crates.io in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          CRATES: ${{ needs.verify.outputs.rust_crates }}
        run: |
          if [[ -z "$CRATES" ]]; then
            echo "::error::the verify job listed no Rust crates"
            exit 1
          fi
          sparse_index_url() {
            local name="${1,,}"
            local len="${#name}"
            case "$len" in
            1) echo "https://index.crates.io/1/$name" ;;
            2) echo "https://index.crates.io/2/$name" ;;
            3) echo "https://index.crates.io/3/${name:0:1}/$name" ;;
            *) echo "https://index.crates.io/${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          in_sparse_index() {
            local url
            url="$(sparse_index_url "$1")"
            curl -fsS -A "libo11y-release-workflow" "$url" 2>/dev/null |
              jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null 2>&1
          }
          for crate in $CRATES; do
            if in_sparse_index "$crate"; then
              echo "$crate@$VERSION is already in the crates.io sparse index; skipping it"
              continue
            fi
            echo "Publishing $crate@$VERSION"
            published=false
            for attempt in 1 2 3 4; do
              if cargo publish --locked -p "$crate" --manifest-path rust/Cargo.toml -j 4; then
                published=true
                break
              fi
              if in_sparse_index "$crate"; then
                echo "$crate@$VERSION landed in the sparse index after publish attempt $attempt"
                published=true
                break
              fi
              echo "attempt $attempt: cargo publish failed for $crate@$VERSION; backing off before retry" >&2
              sleep $((attempt * 15))
            done
            if [[ "$published" != true ]]; then
              echo "::error::cargo publish failed for $crate@$VERSION after retries"
              exit 1
            fi
            # Wait for the crates.io sparse index CDN to serve the new version
            # before publishing crates that depend on it.
            indexed=false
            for attempt in $(seq 1 18); do
              if in_sparse_index "$crate"; then
                indexed=true
                break
              fi
              echo "attempt $attempt: waiting for $crate@$VERSION in the crates.io sparse index" >&2
              sleep 10
            done
            if [[ "$indexed" != true ]]; then
              echo "::error::$crate@$VERSION did not appear in the crates.io sparse index after publishing"
              exit 1
            fi
          done

  smoke-rust:
    needs: [verify, publish-rust]
    if: needs.verify.outputs.kind == 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CRATES: ${{ needs.verify.outputs.rust_crates }}
    steps:
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.95.0"
      - name: Wait for all published crates in the crates.io sparse index
        run: |
          if [[ -z "$CRATES" ]]; then
            echo "::error::the verify job listed no Rust crates"
            exit 1
          fi
          sparse_index_url() {
            local name="${1,,}"
            local len="${#name}"
            case "$len" in
            1) echo "https://index.crates.io/1/$name" ;;
            2) echo "https://index.crates.io/2/$name" ;;
            3) echo "https://index.crates.io/3/${name:0:1}/$name" ;;
            *) echo "https://index.crates.io/${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          for attempt in $(seq 1 20); do
            missing=""
            for crate in $CRATES; do
              url="$(sparse_index_url "$crate")"
              if ! curl -fsS -A "libo11y-release-workflow" "$url" 2>/dev/null |
                jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null 2>&1; then
                missing="$missing $crate"
              fi
            done
            if [[ -z "$missing" ]]; then
              exit 0
            fi
            echo "attempt $attempt: crates.io sparse index does not serve$missing at $VERSION yet" >&2
            sleep 15
          done
          echo "::error::crates.io sparse index did not serve$missing at $VERSION"
          exit 1
      - name: Build and test a fresh consumer against crates.io
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          cat >Cargo.toml <<EOF
          [package]
          name = "libo11y-rust-smoke"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          libo11y = "=$VERSION"
          libo11y-spec = "=$VERSION"
          libo11y-test = "=$VERSION"
          tracing = "0.1"
          EOF
          mkdir -p src
          cat >src/main.rs <<'EOF'
          use libo11y_test::Recorder;

          fn main() {
              let rec = Recorder::start("rust-smoke");
              rec.in_scope(|| {
                  let _span = tracing::info_span!("smoke.op").entered();
                  tracing::info!(smoke.ok = true, "smoke log");
                  rec.sdk()
                      .meter("smoke")
                      .u64_counter("smoke.requests")
                      .build()
                      .add(1, &[]);
              });
              rec.assert_conforms();
              rec.assert_correlated();
              rec.assert_triangle("smoke.requests");
              assert_eq!(rec.sdk().resource().schema_url(), Some(libo11y_spec::SCHEMA_URL));
          }
          EOF
          cargo run -j 4
      - name: Install and run libo11y-cli from crates.io
        run: |
          tmp="$(mktemp -d)"
          cargo install libo11y-cli --version "=$VERSION" --locked --root "$tmp/bin" -j 4
          cat >"$tmp/registry.yaml" <<'EOF'
          schema: libo11y.app-registry/v1
          namespace: smoke
          attributes:
            smoke.order.id: {type: string, sensitivity: internal, cardinality: unbounded}
          EOF
          "$tmp/bin/bin/libo11y" registry check "$tmp/registry.yaml"

  # The GitHub Release waits for smoke-rust so it is created only after the
  # published crates resolve and run for an external consumer.
  release-rust:
    needs: [verify, smoke-rust]
    if: needs.verify.outputs.kind == 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$VERSION" rust/CHANGELOG.md >"$notes"
          title="libo11y Rust v$VERSION"
          # The Go main module's release stays the repository's Latest release.
          if gh release view "$TAG" >/dev/null; then
            echo "$TAG already has a release; replacing its title and notes"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest=false
          else
            gh release create "$TAG" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest=false
          fi

  c-release:
    needs: verify
    if: needs.verify.outputs.kind == 'c'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"
      - name: Build ReleaseSafe C11 release archive and checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          stage="$RUNNER_TEMP/c-stage"
          dist="$RUNNER_TEMP/c-dist"
          prefix="$stage/libo11y-c-v$VERSION-linux-x86_64"
          mkdir -p "$prefix" "$dist"
          (cd c && zig build -j4 -Doptimize=ReleaseSafe --prefix "$prefix")
          cp LICENSE c/README.md c/CHANGELOG.md "$prefix/"
          archive="$dist/libo11y-c-v$VERSION-linux-x86_64.tar.gz"
          tar -C "$stage" -czf "$archive" "libo11y-c-v$VERSION-linux-x86_64"
          (cd "$dist" && sha256sum "libo11y-c-v$VERSION-linux-x86_64.tar.gz" > SHA256SUMS)
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          dist="$RUNNER_TEMP/c-dist"
          scripts/release-notes.sh "$VERSION" c/CHANGELOG.md >"$notes"
          title="libo11y-c v$VERSION"
          # The Go main module's release stays the repository's Latest release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; replacing its title, notes, and assets"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest=false
            gh release upload "$TAG" "$dist/libo11y-c-v$VERSION-linux-x86_64.tar.gz" "$dist/SHA256SUMS" --clobber
          else
            gh release create "$TAG" "$dist/libo11y-c-v$VERSION-linux-x86_64.tar.gz" "$dist/SHA256SUMS" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest=false
          fi

  ops-release:
    needs: verify
    if: needs.verify.outputs.kind == 'ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the ops pack archive and checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/ops-release-check.sh --archive "v$VERSION" "$RUNNER_TEMP/ops-dist"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          dist="$RUNNER_TEMP/ops-dist"
          name="libo11y-ops-v$VERSION"
          scripts/release-notes.sh "$VERSION" ops/CHANGELOG.md >"$notes"
          title="libo11y-ops v$VERSION"
          # The Go main module's release stays the repository's Latest release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; replacing its title, notes, and assets"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$PRERELEASE" --latest=false
            gh release upload "$TAG" "$dist/$name.tar.gz" "$dist/SHA256SUMS" --clobber
          else
            gh release create "$TAG" "$dist/$name.tar.gz" "$dist/SHA256SUMS" --title "$title" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE" --latest=false
          fi
