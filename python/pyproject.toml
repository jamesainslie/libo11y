[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "libo11y"
version = "0.0.0"
description = "Opinionated, elegant observability for Python built purely on OpenTelemetry."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "James Ainslie" }]
keywords = ["opentelemetry", "observability", "telemetry", "otlp", "logging", "tracing", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api==1.45.*",
    "opentelemetry-sdk==1.45.*",
    "opentelemetry-exporter-otlp-proto-http==1.45.*",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://o11y.ing"
Repository = "https://github.com/jamesainslie/libo11y"
Documentation = "https://o11y.ing/docs/"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]
httpx = [
    "httpx>=0.28",
]
requests = [
    "requests>=2.32",
]
grpc = [
    "grpcio>=1.75.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.*",
]
connect = [
    "connectrpc>=0.13.0",
]
psycopg = [
    "psycopg>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.120",
    "ruff>=0.15.14",
    "pyright>=1.1.400",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libo11y"]

[tool.hatch.build.targets.sdist]
include = [
    "src/libo11y",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W", "N", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["libo11y"]

[tool.coverage.report]
show_missing = true
