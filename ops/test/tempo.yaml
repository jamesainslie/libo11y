# Single-binary Tempo with local storage and the OTLP HTTP receiver, cut
# down from the single-binary example Tempo 3.1 publishes. session.id and
# o11y.rum.view.id stay ordinary span attributes: the session explorer
# works without dedicated columns.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
