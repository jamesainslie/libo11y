# The gateway the integration test runs on the host. Loopback plays the CDN
# in front of it: it forwards the client address and sets the country
# header, so the country label is derived. The OTLP sink is the collector
# from compose.yaml.
listen: 127.0.0.1:18080
environment: test
edge:
  forwarded_header: X-Forwarded-For
  country:
    header: CF-IPCountry
    trusted_from: ["127.0.0.0/8", "::1/128"]
apps:
  - service_name: shop-web
    origins: ["https://shop.example"]
sinks:
  otlp:
    endpoint: http://127.0.0.1:4318
    timeout: 5s
