# Scrapes the gateway the test runs on the host, and loads the pack's rule
# files from ops/alerts.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.rules.yaml

scrape_configs:
  - job_name: o11yrum-gateway
    static_configs:
      - targets: ["host.docker.internal:19464"]
