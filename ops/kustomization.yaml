  - name: libo11y-rum-errors
    files: [dashboards/libo11y-rum-errors.json]
  - name: libo11y-rum-session-explorer
    files: [dashboards/libo11y-rum-session-explorer.json]
  - name: libo11y-rum-gateway
    files: [dashboards/libo11y-rum-gateway.json]
