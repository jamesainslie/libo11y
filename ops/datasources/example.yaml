# Example Grafana datasource provisioning for the libo11y RUM ops pack. The
# dashboards select datasources through the prometheus, loki and tempo
# variables, so these UIDs are a convenience, not a requirement. Replace the
# URLs with your own.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        customQuery: false
      search:
        hide: false
