# Registered libo11y events. An Event is a record emitted through the event
# API (SDK.Event in Go, which Record.EmitEvent calls): contract-bearing and
# force-emitted, so exempt from level gating. The exemption is structural,
# not by name: a record that merely carries one of these names in
# event.name, emitted through the ordinary logger, is level-gated like any
# other record. No log sampler exists yet. The event name travels as the
# event.name attribute (the semconv-sanctioned carrier for bridges that
# cannot set the top-level EventName field yet).
groups:
  - id: event.o11y.telemetry.configured
    type: event
    name: o11y.telemetry.configured
    stability: development
    brief: >
      Startup summary, emitted once by Setup after the pipeline is
      constructed and verified (the record doubles as the init canary).
    attributes:
      - ref: o11y.config
        requirement_level: required
        annotations:
          o11y.gen: mint

  - id: event.o11y.request.summary
    type: event
    name: o11y.request.summary
    stability: development
    brief: >
      Wide event: one per request, flushed at request end (fires on panic),
      carrying identity, outcome, duration, and everything accumulated on
      the request record. The primary analytics record.
    attributes:
      - ref: http.request.method
        requirement_level: required
        annotations:
          o11y.gen: alias
      - ref: http.route
        requirement_level:
          conditionally_required: When a route pattern matched.
        annotations:
          o11y.gen: alias
      - ref: http.response.status_code
        requirement_level: required
        annotations:
          o11y.gen: alias
      - ref: o11y.outcome
        requirement_level: required
        annotations:
          o11y.gen: mint
      - ref: o11y.duration
        requirement_level: required
        annotations:
          o11y.gen: mint
      - ref: url.path
        requirement_level: recommended
        annotations:
          o11y.gen: alias
          o11y.sensitivity: internal
          o11y.cardinality: unbounded
      - ref: server.address
        requirement_level: recommended
        annotations:
          o11y.gen: alias

  - id: event.o11y.telemetry.dropped
    type: event
    name: o11y.telemetry.dropped
    stability: development
    brief: >
      Buffered telemetry could not be flushed at shutdown. Emitted
      best-effort to surviving sinks so the loss is never silent.
    attributes:
      - ref: o11y.signal
        requirement_level: required
        annotations:
          o11y.gen: mint
      - ref: error.type
        requirement_level: required
        annotations:
          o11y.gen: alias

  # Registered RUM events. RUM also emits semconv's browser.web_vital event
  # as upstream defines it; that event is upstream's and is not registered
  # here.
  - id: event.o11y.rum.error
    type: event
    name: o11y.rum.error
    stability: development
    brief: An error RUM captured, with its source and, after symbolication, its fingerprint.
    attributes:
      - {ref: o11y.rum.error.source, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: exception.type, requirement_level: required, annotations: {o11y.gen: alias}}
      - {ref: session.id, requirement_level: required, annotations: {o11y.gen: alias}}
      - {ref: o11y.rum.view.id, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.error.fingerprint, annotations: {o11y.gen: mint}}

  - id: event.o11y.rum.frustration
    type: event
    name: o11y.rum.frustration
    stability: development
    brief: A frustration signal on a UI element.
    attributes:
      - {ref: o11y.rum.frustration.type, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: session.id, requirement_level: required, annotations: {o11y.gen: alias}}
      - {ref: o11y.rum.view.id, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.element.selector, annotations: {o11y.gen: mint}}

  - id: event.o11y.rum.session.start
    type: event
    name: o11y.rum.session.start
    stability: development
    brief: A RUM session started.
    attributes:
      - {ref: session.id, requirement_level: required, annotations: {o11y.gen: alias}}
      - {ref: o11y.rum.platform, requirement_level: required, annotations: {o11y.gen: mint}}

  - id: event.o11y.rum.session.end
    type: event
    name: o11y.rum.session.end
    stability: development
    brief: A RUM session ended, with the reason its telemetry was kept.
    attributes:
      - {ref: session.id, requirement_level: required, annotations: {o11y.gen: alias}}
      - {ref: o11y.rum.session.retained, requirement_level: required, annotations: {o11y.gen: mint}}

  - id: event.o11y.rum.view.summary
    type: event
    name: o11y.rum.view.summary
    stability: development
    brief: >
      A view's counts, time on view and vitals since the previous summary of
      the same view. Every consented session sends it, whatever its sampling,
      and the gateway derives the standard RUM metrics from it.
    attributes:
      - {ref: o11y.rum.platform, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.view.id, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.view.name, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.view.kind, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: session.id, requirement_level: required, annotations: {o11y.gen: alias}}
      - {ref: o11y.rum.summary.seq, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.summary.time_on_view, requirement_level: required, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.device.class, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.connection.effective, annotations: {o11y.gen: mint}}
      - {ref: o11y.rum.config.version, annotations: {o11y.gen: mint}}
