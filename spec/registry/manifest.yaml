name: libo11y
description: The libo11y telemetry specification registry.
# The schema URL identifies spec version 1.0.0. Its last path segment is the
# version and carries no file extension. The generated OpenTelemetry schema
# file lives at spec/schemas/<version> and is served at this URL (see
# docs/SPEC.md, Versioning). Released versions are
# immutable; a spec change bumps the version and adds a new file.
schema_url: https://schemas.o11y.ing/libo11y/1.0.0
# The upstream OpenTelemetry semantic conventions release this registry
# extends. Referenced attributes (http.*, k8s.*, ...) are defined by that
# release; libo11y never redefines them. Move the pin deliberately.
semconv_version: 1.41.0
