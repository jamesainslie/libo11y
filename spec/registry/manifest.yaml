name: libo11y
description: The libo11y telemetry specification registry.
# The schema URL identifies spec version 1.0.0 (tagged spec/vX.Y.Z).
# Language modules declare which spec version they implement via generated
# constants.
#
# PLACEHOLDER BASE: replace the host with https://schemas.<domain>/libo11y/
# before the spec/v1.0.0 release (custom-domain decision recorded in the
# plan; only the string must be final by then, serving can follow).
schema_url: https://raw.githubusercontent.com/jamesainslie/libo11y/main/spec/schemas/1.0.0
# The upstream OpenTelemetry semantic conventions release this registry
# extends. Referenced attributes (http.*, k8s.*, ...) are defined by that
# release; libo11y never redefines them. Move the pin deliberately.
semconv_version: 1.41.0
