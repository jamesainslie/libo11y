# Tier 3: opt-in. Never emitted without explicit configuration. Keys
# forbidden by default (PII and credentials) are not a tier; they are
# documented in forbidden.yaml.
groups:
  - id: libo11y.resource.tier3
    type: attribute_group
    display_name: Resource Tier 3 (opt-in)
    brief: Opt-in ownership, tenancy, and classification attributes.
    stability: development
    annotations:
      o11y.tier: "3"
    attributes:
      - ref: o11y.tenant.id
        requirement_level: opt_in
        annotations:
          o11y.source: option
          o11y.signals: traces,logs
          o11y.role: descriptive
          o11y.gen: mint
      - ref: o11y.cost_center
        requirement_level: opt_in
        annotations:
          o11y.source: option-or-collector
          o11y.signals: traces,logs
          o11y.role: descriptive
          o11y.gen: mint
      - ref: o11y.data.classification
        requirement_level: opt_in
        annotations:
          o11y.source: option
          o11y.signals: traces,logs
          o11y.role: descriptive
          o11y.gen: mint
      - ref: o11y.label
        requirement_level: opt_in
        annotations:
          o11y.source: option
          o11y.signals: traces,logs
          o11y.role: descriptive
          o11y.gen: mint
