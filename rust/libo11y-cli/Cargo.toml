readme = "README.md"
keywords = ["observability", "opentelemetry", "telemetry", "cli", "libo11y"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "README.md", "LICENSE"]
version.workspace = true
