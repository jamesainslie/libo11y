[package]
name = "libo11y"
description = "Opinionated OpenTelemetry setup for Rust services: identity, resource, sensitivity policy and propagation that follow the libo11y specification."
readme = "README.md"
build = "build.rs"
keywords = ["observability", "opentelemetry", "telemetry", "tracing", "libo11y"]
categories = ["development-tools::debugging"]
include = ["src/**/*.rs", "build.rs", "README.md", "LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
libo11y-spec = { version = "0.0.0", path = "../libo11y-spec" }
gethostname = "1.1.0"
hmac = "0.13.0"
# Pinned: appregistry/yaml.rs works around this exact release's panics and
# its byte-offset marks, so an upgrade reruns the conformance and fuzz checks.
libyaml-safer = "=0.3.0"
opentelemetry = { version = "0.33.1", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.26.1", default-features = false, features = ["std", "v4", "v5"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
