[package]
name = "libo11y"
description = "Opinionated OpenTelemetry setup for Rust services: identity, resource, sensitivity policy and propagation that follow the libo11y specification."
readme = "README.md"
keywords = ["observability", "opentelemetry", "telemetry", "tracing", "libo11y"]
categories = ["development-tools::debugging"]
include = ["src/**/*.rs", "build.rs", "README.md", "LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
libo11y-spec = { version = "0.0.0", path = "../libo11y-spec" }
thiserror = "2.0.21"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
