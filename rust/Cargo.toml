# The libo11y Rust workspace. Every crate shares one version and is released
# together from a rust/vX.Y.Z tag.
[workspace]
resolver = "3"
members = ["libo11y-redact", "libo11y-spec"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/jamesainslie/libo11y"
homepage = "https://o11y.ing"

# Every dependency is a version published on or before the date the port's
# plan fixed (2026-11-11). Workspace crates pin each other exactly, because
# they are released in lockstep.
[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
